spring:
  application:
    name: db-migration

  datasource:
    master:
      jdbc-url: jdbc:mysql://localhost:3306/moko?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      username: 'root'
      password: '0000'
      driver-class-name: com.mysql.cj.jdbc.Driver
    replica:
      jdbc-url: jdbc:mysql://localhost:3307/moko?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      username: 'root'
      password: '0000'
      driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Togglz Feature Flag 설정
togglz:
  enabled: true
  console:
    enabled: true
    path: /togglz-console
    secured: false
  feature-enums: io.spring.dbmigration.config.FeatureFlags

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Swagger/OpenAPI 3 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      display-name: 'DB Migration API'
      packages-to-scan: io.spring.dbmigration.controller
