version: '3.8'
services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: 0000
      MYSQL_DATABASE: moko
      MYSQL_REPLICATION_USER: replica_user
      MYSQL_REPLICATION_PASSWORD: replica_password
    ports:
      - "3306:3306"
    volumes:
      - master_data:/var/lib/mysql
      - ./docker/mysql/master.cnf:/etc/mysql/conf.d/master.cnf:ro
      - ./docker/mysql/init-master.sql:/docker-entrypoint-initdb.d/init-master.sql:ro
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-slave-updates=ON
      --master-info-repository=TABLE
      --relay-log-info-repository=TABLE
      --transaction-write-set-extraction=XXHASH64
    networks:
      - mysql-network
    restart: unless-stopped

  mysql-replica:
    image: mysql:8.0
    container_name: mysql-replica
    environment:
      MYSQL_ROOT_PASSWORD: 0000
      MYSQL_DATABASE: moko
    ports:
      - "3307:3306"
    volumes:
      - replica_data:/var/lib/mysql
      - ./docker/mysql/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro
      - ./docker/mysql/init-replica.sql:/docker-entrypoint-initdb.d/init-replica.sql:ro
    command: >
      --server-id=2
      --relay-log=mysql-relay-bin
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-slave-updates=ON
      --master-info-repository=TABLE
      --relay-log-info-repository=TABLE
      --transaction-write-set-extraction=XXHASH64
      --read-only=1
      --skip-slave-start
    depends_on:
      - mysql-master
    networks:
      - mysql-network
    restart: unless-stopped

volumes:
  master_data:
  replica_data:

networks:
  mysql-network:
    driver: bridge